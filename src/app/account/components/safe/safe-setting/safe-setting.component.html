<div class="modal " id="updateStudentInfo" tabindex="-1" role="dialog"   >
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content w3-animate-top">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title text-center">{{ "update student info" | trans }}</h4>
      </div>
      <div class="modal-body">
        <table class="table">
          <tr>
            <th>{{ "is_refund" | trans }}</th>
            <td>
              <mat-slide-toggle
              (change)="toggleIsRefund()"
              [checked]="safeObject.is_refund == 1" ></mat-slide-toggle>
            </td>
          </tr>
        </table>
      </div>
      <div class="modal-footer text-right">
        <button type="button" class="btn btn-default"  class="close" data-dismiss="modal" aria-label="Close" >{{ "close" | trans }}</button>
      </div>
    </div><!-- /.modal-content -->
  </div><!-- /.modal-dialog -->
</div><!-- /.modal -->
<div class="modal" tabindex="-1" role="dialog" [ngStyle]="{'display':displayLic}" style="background-color: rgba(90,90,90,0.5);">
    <div class="modal-dialog" role="document">
        <div class="modal-content" style="    margin-top: 250px;">
            <div class="modal-header" style="background-color:#b10d0d;">
              <p style="color: white;font-size: 20px;"> تنبية</p>
            </div>
            <div class="modal-body">
                <h3 style="color: #b10d0d;"> هذه النسخة غير مرخصة </h3>
            </div>

        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
