<div class="w3-block w3-row">
  <div class="w3-white material-shadow safe-box w3-block">
      <div class="safe-box-header w3-large" style="padding: 5px!important">
 تقرير متابعة تسجيل المقررات
      </div>
      <div class="border-bottom-dashed"></div>
      <br>

      <div class="">

          <div class="">
              <div class="custom-panel w3-display-container w3-round application-panel student-info-panel">

                  <div class="custom-panel-body table-responsive w3-padding">

                      <div id="form" class="row">

                        <div class="col-lg-3 col-md-4">
                            <div class="form-group">
                                <label for="">{{ "level" | trans }}</label>
                                <select id="level_id" name="filter.level_id" class="form-control" [(ngModel)]="filter.level_id">
                                <option value="">الكل</option>
                                <option *ngFor="let item of levels" value="{{ item.id }}">{{item.name}}</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-lg-3 col-md-4">
                              <div class="form-group">
                                  <label for="">{{ "division" | trans }}</label>
                                  <select id="division_id" name="filter.division_id" class="form-control" [(ngModel)]="filter.division_id">
                                  <option value="">الكل</option>
                                  <option *ngFor="let item of divisions" value="{{ item.id }}">{{item.name}}</option>
                                  </select>
                              </div>
                        </div>

                        <div class="col-lg-3 col-md-4">
                            <div class="form-group">
                                <label for="">{{ "academic year" | trans }}</label>
                                <select name="filter.year_id" class="form-control" [(ngModel)]="filter.year_id">
                                <option value="">الكل</option>
                                <option *ngFor="let item of applicationService.ACADEMIC_YEARS" value="{{ item.id }}">{{item.name}}</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="col-lg-3 col-md-4">
                              <div class="form-group">
                                  <label for="">{{ "term" | trans }}</label>
                                  <select id="term_id" name="filter.term_id" class="form-control" [(ngModel)]="filter.term_id">
                                  <option value="">الكل</option>
                                  <option *ngFor="let item of terms" value="{{ item.id }}">{{item.name}}</option>
                                  </select>
                              </div>
                        </div>

                        <div class="col-lg-3 col-md-3">
                            <div class="form-group">
                                <label>تاريخ التسجيل من </label>
                                <input class="form-control" type="date" [(ngModel)]="filter.date_from">
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-3">
                            <div class="form-group">
                                <label> تاريخ التسجيل الي </label>
                                <input class="form-control" type="date" [(ngModel)]="filter.date_to">
                            </div>
                        </div>
  <div class="col-lg-3 col-md-3">
                            <div class="form-group">
                                <label>   كود الطالب </label>
                                <input class="form-control" type="text" [(ngModel)]="filter.student_id">
                            </div>
                        </div>
                       

                          <!-- <div class="col-lg-3 col-md-4">
                            <div class="form-group">
                                <label for="">{{ "course" | trans }}</label>
                                <select name="filter.course_id" class="form-control" [(ngModel)]="filter.course_id">
                          <option value="">الكل</option>
                    <option *ngFor="let item of courses|level:level_id|term:term_id|division:division_id|year:year_id" value="{{ item.course_id }}">{{item.course_name}}</option>
                  </select>
                            </div>
                        </div> -->

                          

                          <div style="display: flex;" class="col-lg-3 col-md-4">
                              <button   class="btn btn-default w3-round" (click)="load(1)">{{ "search" | trans }}</button>
                              <button style="margin: 0 5px;" class="btn btn-default w3-round" (click)="printContent()">{{ "print" | trans }}</button>
                              <button class="btn btn-default w3-round" (click)="excel()">{{ "excel" | trans }}</button>
                          </div>


                      </div>

                  </div>
              </div>
          </div>
          <div class="">
              <div class="custom-panel w3-display-container w3-round application-panel student-info-panel" id="printable">

                  <div dir="rtl" class="custom-panel-body table-responsive w3-padding" id="reportContent">

                        <table class="table table-striped">
                          <thead>
                            <tr>
                              <th scope="col">#</th>
                              <th scope="col">اسم الطالب</th>
                              <th scope="col">المواد</th>
                              <th scope="col">الموظف</th>
                                <th scope="col">التاريخ</th>

                            </tr>
                          </thead>
                          <tbody>
                            <tr *ngFor="let item of arrofStudent">
                              <th scope="row">{{item.student_id}}</th>
                              <td>{{item.student_name}}</td>
                              <td>
                                <span *ngFor="let itemc of item.courses">
                                  <span>{{itemc}}</span><br>
                                </span>
                              </td>
                              <td> <span *ngFor="let itemusers of item.users">
                                  <span>{{itemusers}}</span><br>
                                </span>
                              </td>
                              <td> 
                                <span *ngFor="let itemdates of item.dates">
                                  <span>{{itemdates}}</span><br>
                                </span>
                              </td>
                            </tr>
                           
                            
                          </tbody>
                        </table>
                  </div>
              </div>
          </div>

<div class="w3-center" *ngIf="pagination && pagination.total > 0">
  <ul class="pagination" style="display:inline-flex; list-style:none; padding-left:0;">
    
    <!-- Previous -->
    <li 
      class="page-item" 
      [class.disabled]="pagination.current_page === 1"
      style="margin:0 3px; cursor:pointer;"
    >
      <a class="page-link" (click)="changePage(pagination.current_page - 1)">
        ‹
      </a>
    </li>

    <!-- Page numbers -->
    <li 
      *ngFor="let p of pages" 
      class="page-item" 
      [class.active]="p === pagination.current_page"
      style="margin:0 3px; cursor:pointer;"
    >
      <a class="page-link" (click)="changePage(p)">
        {{ p }}
      </a>
    </li>

    <!-- Next -->
    <li 
      class="page-item" 
      [class.disabled]="pagination.current_page === pagination.last_page"
      style="margin:0 3px; cursor:pointer;"
    >
      <a class="page-link" (click)="changePage(pagination.current_page + 1)">
        ›
      </a>
    </li>
  </ul>

  <div class="w3-small" style="margin-top:5px;">
    عرض من {{ pagination.from }} إلى {{ pagination.to }} من إجمالي {{ pagination.total }} سجل
  </div>
</div>


      </div>


  </div>
</div>

              <p style="color: white;font-size: 20px;"> تنبية</p>
            </div>
            <div class="modal-body">
                <h3 style="color: #b10d0d;"> هذه النسخة غير مرخصة </h3>
            </div>

        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
